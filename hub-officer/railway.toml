# Deploy no Railway (config as code)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Uma réplica em OFFICE_ROLE=all (o barramento em memória não é compartilhado entre réplicas).
# Para escalar: crie um segundo serviço com OFFICE_ROLE=worker, mude este para OFFICE_ROLE=api
# e configure REDIS_URL — aí o serviço worker pode ter várias réplicas.
numReplicas = 1
